name: Fork Windows release

on:
  push:
    branches: [mine]
    paths: [desktop/release.json]
  workflow_dispatch:
    inputs:
      version:
        description: Leave empty to number the build from n8n's version (n8n's 0.9.1 gives 0.9.200, then 0.9.201). A version you enter must be in that range and higher than every nod-v tag on this fork.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

jobs:
  plan:
    name: Choose the version and the runtime
    if: github.repository != 'n8n-io/nod' && github.ref == 'refs/heads/mine'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_needed: ${{ steps.plan.outputs.release_needed }}
      base: ${{ steps.plan.outputs.base }}
      version: ${{ steps.plan.outputs.version }}
      runtime_fingerprint: ${{ steps.plan.outputs.runtime_fingerprint }}
      runtime_tag: ${{ steps.plan.outputs.runtime_tag }}
      runtime_refresh: ${{ steps.plan.outputs.runtime_refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Rebuild the runtime at least weekly
        run: echo "NOD_RUNTIME_REFRESH=$(date -u -d "-$(( $(date -u +%u) - 1 )) days" +%F)" >> "$GITHUB_ENV"
      - name: Choose the version and a runtime to reuse
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          NOD_FORK_VERSION: ${{ inputs.version }}
        run: node .github/scripts/fork-windows-release.mjs

  runtime:
    name: Build or reuse the Windows runtime
    needs: plan
    if: needs.plan.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NOD_RUNTIME_ASSETS: .local/windows-runtime-assets
      NOD_RUNTIME_REFRESH: ${{ needs.plan.outputs.runtime_refresh }}
      NOD_WINDOWS_RUNTIME_FINGERPRINT: ${{ needs.plan.outputs.runtime_fingerprint }}
      NOD_WINDOWS_RUNTIME_TAG: ${{ needs.plan.outputs.runtime_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Reuse the runtime of an earlier release
        id: reuse
        if: env.NOD_WINDOWS_RUNTIME_TAG != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/desktop-release.mjs reuse-windows-runtime
      - name: Build a fresh runtime when none can be reused
        id: build
        if: env.NOD_WINDOWS_RUNTIME_TAG == '' || steps.reuse.outcome == 'failure'
        env:
          REUSE: ${{ steps.reuse.outcome }}
        run: |
          if [ "$REUSE" = failure ]; then echo "::warning title=Runtime rebuilt::The runtime of $NOD_WINDOWS_RUNTIME_TAG failed its checks, so this run builds a fresh one."; fi
          echo needed=true >> "$GITHUB_OUTPUT"
      - name: Make room for the runtime images
        if: steps.build.outputs.needed == 'true'
        run: |
          rm -rf "$NOD_RUNTIME_ASSETS"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - if: steps.build.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the workspace image
        if: steps.build.outputs.needed == 'true'
        run: docker build --platform linux/amd64 --file Dockerfile.workspace --build-arg "NOD_RUNTIME_REFRESH=$NOD_RUNTIME_REFRESH" --tag nod-desktop-workspace:experiment .
      - name: Build the browser image
        if: steps.build.outputs.needed == 'true'
        run: docker build --platform linux/amd64 --file Dockerfile.browser --build-arg "NOD_RUNTIME_REFRESH=$NOD_RUNTIME_REFRESH" --tag nod-desktop-browser:experiment .
      - name: Verify and export the native images
        if: steps.build.outputs.needed == 'true'
        env:
          NOD_DESKTOP_TARGET: win32-x64
        run: node desktop/scripts/prepare-runtime.mjs --images-only --prebuilt-images
      - name: Build the Windows root filesystem
        if: steps.build.outputs.needed == 'true'
        env:
          NOD_DESKTOP_TARGET: win32-x64
        run: node desktop/scripts/prepare-windows-runtime.mjs --prebuilt-images
      - name: Check that the runtime matches the planned fingerprint
        run: test -f "$NOD_RUNTIME_ASSETS/runtime-win32-x64-$NOD_WINDOWS_RUNTIME_FINGERPRINT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-runtime
          path: |
            .local/windows-runtime-assets/guest.tar.gz
            .local/windows-runtime-assets/manifest.json
            .local/windows-runtime-assets/runtime-win32-x64-*.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  windows:
    name: Package and check the Windows installer
    needs: [plan, runtime]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      NOD_DESKTOP_VERSION: ${{ needs.plan.outputs.version }}
      NOD_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          choco install nsis --yes --no-progress
      - name: Download verified Windows Electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/prepare-windows-electron.mjs
      - run: pnpm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-windows-runtime
          path: .local/windows-runtime-assets
      - name: Package the Windows installer
        run: node desktop/scripts/build-windows.mjs
      - name: Install and check the Windows app
        run: node desktop/scripts/check-windows.mjs
      - run: Copy-Item .local/windows-runtime-assets/runtime-win32-x64-*.json dist/windows/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-x64
          path: |
            dist/windows/runtime-win32-x64-*.json
            dist/windows/nod-Setup-x64.exe
            dist/windows/nod-Runtime-win32-x64.tar.gz
            dist/windows/SHA256SUMS
            dist/windows/release-win32-x64.json
            dist/windows/windows-check.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release on this fork
    needs: [plan, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-windows-x64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nod-v$VERSION" --silent 2>/dev/null; then
            echo "The tag nod-v$VERSION already exists on this fork." >&2
            exit 1
          fi
          cat > notes.md <<'EOF'
          Windows build of this fork of [Nod](https://github.com/n8n-io/nod), version VERSION_HERE. It comes from the fork's `mine` branch at commit SHA_HERE: n8n's `main` as of its last merge into the fork, plus the fork's own changes. n8n's desktop version at that point was BASE_HERE.

          This is not an official n8n release. The installer is not code-signed, so Windows SmartScreen may warn before it runs: choose **More info**, then **Run anyway**.

          You need Windows 11 x64, WSL 2 with hardware virtualization, and at least 20 GB of free disk space. Download `nod-Setup-x64.exe` and run it; if Nod needs WSL, follow its setup and approve the administrator request. The app downloads `nod-Runtime-win32-x64.tar.gz` from this release on first start, then updates itself from this fork's newest release.
          EOF
          sed -i "s/VERSION_HERE/$VERSION/; s/BASE_HERE/$BASE/; s/SHA_HERE/$GITHUB_SHA/" notes.md
          gh release create "nod-v$VERSION" dist/nod-Setup-x64.exe dist/nod-Runtime-win32-x64.tar.gz dist/release-win32-x64.json dist/SHA256SUMS dist/runtime-win32-x64-*.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nod $VERSION (fork, Windows)" --notes-file notes.md --latest
