name: Fork Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of this build, such as 0.9.1. It becomes the release tag nod-v<version> on this fork.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

jobs:
  runtime:
    name: Build the Windows runtime
    if: github.repository != 'n8n-io/nod'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NOD_RUNTIME_ASSETS: .local/windows-runtime-assets
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Use a version like 0.9.1, not $VERSION." >&2; exit 1; }
      - name: Make room for the runtime images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the workspace image
        run: docker build --platform linux/amd64 --file Dockerfile.workspace --build-arg NOD_RUNTIME_REFRESH=${{ github.run_id }} --tag nod-desktop-workspace:experiment .
      - name: Build the browser image
        run: docker build --platform linux/amd64 --file Dockerfile.browser --build-arg NOD_RUNTIME_REFRESH=${{ github.run_id }} --tag nod-desktop-browser:experiment .
      - name: Verify and export the native images
        env:
          NOD_DESKTOP_TARGET: win32-x64
        run: node desktop/scripts/prepare-runtime.mjs --images-only --prebuilt-images
      - name: Build the Windows root filesystem
        env:
          NOD_DESKTOP_TARGET: win32-x64
        run: node desktop/scripts/prepare-windows-runtime.mjs --prebuilt-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-runtime
          path: |
            .local/windows-runtime-assets/guest.tar.gz
            .local/windows-runtime-assets/manifest.json
            .local/windows-runtime-assets/runtime-win32-x64-*.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  windows:
    name: Package and check the Windows installer
    needs: runtime
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      NOD_DESKTOP_VERSION: ${{ inputs.version }}
      NOD_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          choco install nsis --yes --no-progress
      - name: Download verified Windows Electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/prepare-windows-electron.mjs
      - run: pnpm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-windows-runtime
          path: .local/windows-runtime-assets
      - name: Package the Windows installer
        run: node desktop/scripts/build-windows.mjs
      - name: Install and check the Windows app
        run: node desktop/scripts/check-windows.mjs
      - run: Copy-Item .local/windows-runtime-assets/runtime-win32-x64-*.json dist/windows/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-x64
          path: |
            dist/windows/runtime-win32-x64-*.json
            dist/windows/nod-Setup-x64.exe
            dist/windows/nod-Runtime-win32-x64.tar.gz
            dist/windows/SHA256SUMS
            dist/windows/release-win32-x64.json
            dist/windows/windows-check.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release on this fork
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-windows-x64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cat > notes.md <<'EOF'
          Windows build of this fork of [Nod](https://github.com/n8n-io/nod), version VERSION_HERE, from commit SHA_HERE.

          This is not an official n8n release. The installer is not code-signed, so Windows SmartScreen may warn before it runs: choose **More info**, then **Run anyway**.

          You need Windows 11 x64, WSL 2 with hardware virtualization, and at least 20 GB of free disk space. Download `nod-Setup-x64.exe` and run it; if Nod needs WSL, follow its setup and approve the administrator request. The app downloads `nod-Runtime-win32-x64.tar.gz` from this release on first start, and later updates come from this fork's releases.
          EOF
          sed -i "s/VERSION_HERE/$VERSION/; s/SHA_HERE/$GITHUB_SHA/" notes.md
          gh release create "nod-v$VERSION" dist/nod-Setup-x64.exe dist/nod-Runtime-win32-x64.tar.gz dist/release-win32-x64.json dist/SHA256SUMS dist/runtime-win32-x64-*.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nod $VERSION (fork, Windows)" --notes-file notes.md
