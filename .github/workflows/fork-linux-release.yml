name: Fork Linux release

on:
  workflow_run:
    workflows: [Fork Windows release]
    types: [completed]
    branches: [mine]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to add the Linux files to, such as nod-v0.9.900. Leave empty for the latest release.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fork-linux-release
  cancel-in-progress: false

jobs:
  plan:
    name: Choose the release
    if: >-
      github.repository != 'n8n-io/nod' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - name: Find the release that has no Linux app yet
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          if ! [[ "$tag" =~ ^nod-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "\"$tag\" is not a fork release tag like nod-v0.9.900." >&2
            exit 1
          fi
          found=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | index("nod-linux-x64.flatpak") != null')
          needed=true
          if [ "$found" = true ]; then
            needed=false
            echo "::notice title=No Linux build needed::$tag already has the Linux app."
          fi
          source=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          {
            echo "needed=$needed"
            echo "tag=$tag"
            echo "version=${tag#nod-v}"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and check the Linux Flatpak
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NOD_DESKTOP_TARGET: linux-x64
      NOD_DESKTOP_VERSION: ${{ needs.plan.outputs.version }}
      NOD_RELEASE_SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Rebuild the runtime at least weekly
        run: echo "NOD_RUNTIME_REFRESH=$(date -u -d "-$(( $(date -u +%u) - 1 )) days" +%F)" >> "$GITHUB_ENV"
      - name: Make room for the runtime images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install build tools and Flatpak runtimes
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y dbus flatpak flatpak-builder python3-dbusmock zstd
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
      - name: Build the workspace image
        run: docker build --platform linux/amd64 --file Dockerfile.workspace --build-arg "NOD_RUNTIME_REFRESH=$NOD_RUNTIME_REFRESH" --tag nod-desktop-workspace:experiment .
      - name: Build the browser image
        run: docker build --platform linux/amd64 --file Dockerfile.browser --build-arg "NOD_RUNTIME_REFRESH=$NOD_RUNTIME_REFRESH" --tag nod-desktop-browser:experiment .
      - name: Check and build the app
        run: |
          pnpm run desktop:test
          pnpm run build
          node desktop/scripts/prepare-runtime.mjs --prebuilt-images
      - name: Pack the Linux runtime
        env:
          NOD_RUNTIME_RELEASE_BASE_URL: ${{ format('https://github.com/{0}/releases/download/{1}', github.repository, needs.plan.outputs.tag) }}
          NOD_RUNTIME_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node desktop/scripts/runtime-pack.mjs
          docker system prune --all --force
          df -h /
      - name: Package the Linux app
        run: pnpm run desktop:linux:build
      - name: Build and install the Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --default-branch=stable --repo=.local/flatpak-repo .local/flatpak-build desktop/flatpak/io.n8n.Nod.yml
          flatpak build-bundle --arch=x86_64 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo .local/flatpak-repo .local/nod-linux-x64.flatpak io.n8n.Nod stable
          flatpak install --user --noninteractive --no-deps .local/nod-linux-x64.flatpak
      - name: Check the installed engine inside Flatpak
        run: |
          dbus-run-session -- flatpak run --env=ELECTRON_RUN_AS_NODE=1 --command=sh io.n8n.Nod -c 'cd /app/nod/resources/engine && exec "$@"' nod-check /app/nod/nod --input-type=module -e '
            const { register } = await import("tsx/esm/api");
            register();
            await import("./src/server/composition.ts");
            const { pool } = await import("./src/server/db.ts");
            await pool.end();
            const sharp = (await import("sharp")).default;
            await sharp({ create: { width: 2, height: 2, channels: 4, background: "#ff0000" } }).png().toBuffer();
          '
      - name: Check power services through the installed Flatpak
        run: /usr/bin/python3 desktop/scripts/check-linux-power.py
      - name: Check the release files
        run: |
          NOD_FLATPAK_COMMIT="$(flatpak info --user --show-commit io.n8n.Nod)"
          export NOD_FLATPAK_COMMIT
          node desktop/scripts/linux-release.mjs
          mkdir -p dist/fork-linux
          mv dist/desktop/linux-x64/release-linux-x64.json dist/desktop/linux-x64/SHA256SUMS-linux-x64 dist/desktop/linux-x64/nod-linux-x64.flatpak dist/fork-linux/
          mv .local/desktop-runtime-release/nod-Runtime-linux-x64-*.tar.gz dist/fork-linux/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fork-linux-x64
          path: dist/fork-linux
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Add the Linux app to the release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fork-linux-x64
          path: dist
      - name: Upload the files and describe the Linux install
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release upload "$TAG" dist/nod-Runtime-linux-x64-*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" dist/SHA256SUMS-linux-x64 dist/release-linux-x64.json dist/nod-linux-x64.flatpak --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if ! grep -q '^## Linux' notes.md; then
            cat >> notes.md <<'NOTES'

          ## Linux (preview)

          For 64-bit Intel or AMD computers with Flatpak, hardware virtualization (`/dev/kvm`) and a secret store such as GNOME Keyring or KWallet. Download `nod-linux-x64.flatpak` and `SHA256SUMS-linux-x64` into one empty folder, then run there:

          ```sh
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sha256sum --check SHA256SUMS-linux-x64 && flatpak install --user ./nod-linux-x64.flatpak
          flatpak run io.n8n.Nod
          ```

          The app downloads its runtime from this release on first start. It doesn't update itself on Linux: to update, quit Nod and install the newer bundle the same way. Your data stays. This bundle uses the same app ID as n8n's Flatpak, so it replaces that one if you have it.
          NOTES
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Nod $VERSION (fork)" --notes-file notes.md
