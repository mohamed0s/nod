<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nod helper</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <h1>Nod</h1>
      <span id="status" class="pill">Connecting…</span>
    </header>
    <main>
      <section id="notice" class="notice" hidden></section>
      <section id="invites" class="block" hidden></section>
      <section id="company" class="block"></section>
      <section id="accepted" class="block"></section>
    </main>
    <footer class="bottom">
      <label class="switch">
        <input id="connections" type="checkbox" />
        <span>Spot accepts when I open my LinkedIn connections list</span>
      </label>
      <button id="refresh" type="button" class="quiet">Refresh</button>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
